name: adwaitter_icons
description: Official GNOME Adwaita symbolic and full-color icon theme for Flutter.
version: 1.0.0-alpha.8
homepage: https://github.com/CarrsterX/Adwaitter_Icons
repository: https://github.com/CarrsterX/Adwaitter_Icons
issue_tracker: https://github.com/CarrsterX/Adwaitter_Icons/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  assets:
    - assets/fullcolor/devices/
    - assets/fullcolor/mimetypes/
    - assets/fullcolor/places/
    - assets/fullcolor/status/
  fonts:
    - family: AdwaitaIcons
      fonts:
        - asset: assets/fonts/AdwaitaIcons.ttf
